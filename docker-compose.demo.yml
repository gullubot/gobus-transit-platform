services:
  # ──────────────────────────────────────────────
  # PostgreSQL with PostGIS (Demo DB)
  # ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: demo-transit-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port 5432 is intentionally NOT mapped to host to prevent external access
    networks:
      - demo-network

  # ──────────────────────────────────────────────
  # FastAPI Backend (Demo API)
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-transit-api
    restart: always
    environment:
      - APP_ENV=demo
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Port 8000 is intentionally NOT mapped to host, accessed via caddy only
    networks:
      - demo-network

  # ──────────────────────────────────────────────
  # Admin Web (Static Build)
  # ──────────────────────────────────────────────
  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: demo-transit-admin-web
    restart: always
    volumes:
      - admin_web_assets:/usr/share/caddy
    networks:
      - demo-network

  # ──────────────────────────────────────────────
  # Caddy (Reverse Proxy)
  # ──────────────────────────────────────────────
  caddy:
    image: caddy:2
    container_name: demo-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.demo:/etc/caddy/Caddyfile
      - admin_web_assets:/usr/share/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin-web
    networks:
      - demo-network

volumes:
  demo-pgdata:
  admin_web_assets:
  caddy_data:
  caddy_config:

networks:
  demo-network:
    driver: bridge
