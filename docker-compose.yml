
services:
  # ──────────────────────────────────────────────
  # PostgreSQL with PostGIS
  # ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: transit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-transit_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transit} -d ${POSTGRES_DB:-transit_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
