# Alembic Configuration — Transit Platform

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://transit:transit_dev_password@localhost:5432/transit_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-8s %(name)s — %(message)s
datefmt = %Y-%m-%d %H:%M:%S
