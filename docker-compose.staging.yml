services:
  # ──────────────────────────────────────────────
  # PostgreSQL with PostGIS (Staging DB)
  # ──────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: staging-transit-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port 5432 is intentionally NOT mapped to host to prevent external access
    networks:
      - staging-network

  # ──────────────────────────────────────────────
  # FastAPI Backend (Staging API)
  # ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: staging-transit-api
    restart: always
    environment:
      - APP_ENV=staging
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Port 8000 is intentionally NOT mapped to host, accessed via caddy only
    networks:
      - staging-network

  # ──────────────────────────────────────────────
  # Caddy (Reverse Proxy + Automatic HTTPS)
  # ──────────────────────────────────────────────
  caddy:
    image: caddy:2
    container_name: staging-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - staging-network

volumes:
  staging-pgdata:
  caddy_data:
  caddy_config:

networks:
  staging-network:
    driver: bridge
